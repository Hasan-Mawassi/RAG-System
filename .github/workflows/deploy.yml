name: Deploy RAG Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to VM
      run: |
       ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' <<'ENDSSH'
         # Go to project folder or clone it if missing
         if [ ! -d ~/rag-project ]; then
        git clone https://github.com/Hasan-Mawassi/RAG-System.git ~/rag-project
        fi

        cd ~/rag-project || exit 1

        # Pull latest code
        git fetch --all
        git reset --hard origin/main

        # Deploy Docker Compose stack
        docker compose down
        docker compose build
       docker compose up -d
       ENDSSH
