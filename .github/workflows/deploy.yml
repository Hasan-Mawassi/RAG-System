name: Deploy RAG Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VM
        run: |
          ssh -A -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash << 'ENDSSH'
            set -ex
            export HOME=/home/${{ secrets.VM_USER }}
            REPO_PATH="/home/${{ secrets.VM_USER }}/rag-project"

            # Remove existing repo and clone fresh
            if [ -d "$REPO_PATH" ]; then
              rm -rf "$REPO_PATH"
            fi

            # Clone repository
            mkdir -p "$REPO_PATH"
            git clone git@github.com:Hasan-Mawassi/RAG-System.git "$REPO_PATH"

            # Navigate to repo
            cd "$REPO_PATH" || exit 1

            # Verify we're in a git repo
            git status

            # Pull latest code
            git fetch --all
            git reset --hard origin/main

            # Deploy Docker Compose stack
            docker compose down || true
            docker compose build
            docker compose up -d
          ENDSSH
