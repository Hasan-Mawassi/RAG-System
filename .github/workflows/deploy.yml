name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_COMPOSE_FILE: docker-compose.yml
  BACKEND_SERVICE: backend
  FRONTEND_SERVICE: frontend

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${DATABASE_URL}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        working-directory: ./rag-server
        run: npm ci

      - name: Run backend tests
        working-directory: ./rag-server
        run: npm run test

      - name: Install frontend dependencies
        working-directory: ./rag-frontend
        run: npm ci

      # - name: Run frontend tests
      #   working-directory: ./rag-frontend
      #   run: npm run test

  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rag-backend:latest -f docker/backend/Dockerfile ./rag-server
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-backend:latest

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_BASE_URL="http://20.174.18.166:5000" \
            -t ${{ secrets.DOCKER_USERNAME }}/rag-frontend:latest \
            -f docker/frontend/Dockerfile ./rag-frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-frontend:latest

  deploy-to-azure:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/rag-project
            git pull origin main
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/rag-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/rag-frontend:latest
            # Stop old containers
            docker compose down
            # Start containers using docker-compose.yml
            docker compose up -d --remove-orphans
            docker image prune -f
