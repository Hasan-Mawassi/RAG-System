name: Deploy RAG Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VM
        run: |
          ssh -A -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' <<'ENDSSH'
            set -e
            REPO_PATH="$HOME/rag-project"

            # Clone if it doesn't exist
            if [ ! -d "$REPO_PATH" ]; then
              git clone git@github.com:Hasan-Mawassi/RAG-System.git "$REPO_PATH"
            fi

            # Always go to repo directory
            cd "$REPO_PATH"

            # Pull latest code
            git fetch --all
            git reset --hard origin/main

            # Deploy Docker Compose stack
            docker compose down || true
            docker compose build
            docker compose up -d
          ENDSSH
