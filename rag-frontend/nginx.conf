server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback to index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files correctly
    location /assets/ {
        try_files $uri =404;
    }
}
